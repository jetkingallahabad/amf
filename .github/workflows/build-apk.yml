      - name: Find Android Project
        run: |
          echo "Searching for Gradle Wrapper..."
          find . -type f -name gradlew

      - name: Build Debug APK
        run: |
          GRADLEW=$(find . -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew file not found in repository"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug
